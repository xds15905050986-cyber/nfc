<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5 NFC 芯片ID读取器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; text-align: center; background-color: #f4f4f9; color: #333; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 450px; margin: 0 auto; text-align: left; }
        h2 { text-align: center; margin-top: 0; }
        p { text-align: center; color: #666; font-size: 14px; }
        button { padding: 12px; font-size: 15px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        button.secondary { background-color: #6c757d; }
        button.danger { background-color: #dc3545; }
        button:active { opacity: 0.8; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #result { margin-top: 15px; padding: 12px; background: #f8f9fa; border-radius: 8px; word-break: break-all; border: 1px solid #e9ecef; font-size: 14px; }
        .error { color: #dc3545; }
        .success { color: #28a745; font-weight: bold; }
        .warning { color: #e6a23c; font-weight: bold; }
        
        .setting-group { margin: 15px 0; text-align: left; }
        .setting-group label { font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        .setting-group select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }

        /* 历史记录样式 */
        .history-section { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .history-header h3 { margin: 0; font-size: 16px; }
        .history-actions { display: flex; gap: 5px; }
        .history-list { max-height: 220px; overflow-y: auto; border: 1px solid #e9ecef; border-radius: 6px; background: #fafafa; padding: 5px; }
        .history-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .history-item:last-child { border-bottom: none; }
        .history-info { word-break: break-all; margin-right: 10px; }
        .copy-sm { padding: 4px 8px; font-size: 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; width: auto; margin: 0; }
        .action-sm { padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; width: auto; margin: 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>NFC 芯片 ID 读取器</h2>
    <p>点击按钮后，将 NFC 卡片贴近手机背面顶部。</p>
    
    <div class="setting-group">
        <label for="readMode">读卡模式：</label>
        <select id="readMode">
            <option value="single">单次读卡（读取一次后自动停止）</option>
            <option value="continuous">连续读卡（可连续读取多张不同卡）</option>
        </select>
    </div>

    <button id="scanBtn">开始扫描 NFC</button>
    <button id="stopBtn" class="secondary" style="display:none;">停止扫描</button>
    
    <div id="result">等待操作...</div>

    <div class="history-section">
        <div class="history-header">
            <h3>历史记录 (<span id="count">0</span>)</h3>
            <div class="history-actions">
                <button class="secondary action-sm" id="copyAllBtn">复制全部</button>
                <button class="danger action-sm" id="clearBtn">清空</button>
            </div>
        </div>
        <div class="history-list" id="historyList">
            <div style="text-align: center; color: #999; padding: 15px; font-size: 13px;">暂无历史记录</div>
        </div>
    </div>
</div>

<script>
    const scanBtn = document.getElementById('scanBtn');
    const stopBtn = document.getElementById('stopBtn');
    const readModeSelect = document.getElementById('readMode');
    const resultDiv = document.getElementById('result');
    const historyList = document.getElementById('historyList');
    const countSpan = document.getElementById('count');
    const clearBtn = document.getElementById('clearBtn');
    const copyAllBtn = document.getElementById('copyAllBtn');

    // 从 localStorage 读取历史记录，支持刷新留存[cite: 1]
    let historyData = JSON.parse(localStorage.getItem('nfc_history') || '[]');
    let abortController = null;
    let isScanning = false;

    // 防抖与去重变量（已将间隔调整为1秒）
    let lastUid = '';
    let lastReadTime = 0;
    const DEBOUNCE_TIME = 1000; // 1秒内的相同刷卡事件视为重复触发[cite: 1]

    function renderHistory() {
        countSpan.textContent = historyData.length;
        if (historyData.length === 0) {
            historyList.innerHTML = '<div style="text-align: center; color: #999; padding: 15px; font-size: 13px;">暂无历史记录</div>';
            return;
        }
        
        let html = '';
        historyData.forEach((item) => {
            html += `
                <div class="history-item">
                    <div class="history-info">
                        <span style="color:#888; font-size:11px;">[${item.time}]</span><br>
                        <strong>UID:</strong> <code>${item.uid}</code>
                    </div>
                    <button class="copy-sm" onclick="copyText('${item.uid}')">复制</button>
                </div>
            `;
        });
        historyList.innerHTML = html;
    }

    // 通用复制方法[cite: 1]
    window.copyText = function(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                alert('复制成功！');
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        let textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            alert('复制成功！');
        } catch (err) {
            alert('复制失败，请手动长按复制。');
        }
        document.body.removeChild(textArea);
    }

    // 清空按钮[cite: 1]
    clearBtn.addEventListener('click', () => {
        if (confirm('确定要清空所有历史记录吗？')) {
            historyData = [];
            localStorage.removeItem('nfc_history');
            renderHistory();
        }
    });

    // 复制全部按钮：仅提取 UID，每行一个，无前缀
    copyAllBtn.addEventListener('click', () => {
        if (historyData.length === 0) {
            alert('暂无记录可复制');
            return;
        }
        let allText = historyData.map(h => h.uid).join('\n');
        copyText(allText);
    });

    // 初始化渲染[cite: 1]
    renderHistory();

    if (!('NDEFReader' in window)) {
        resultDiv.innerHTML = '<span class="error">当前浏览器不支持 Web NFC。<br><small>请确保使用安卓端 Chrome 浏览器。</small></span>';
        scanBtn.disabled = true;
    }

    function stopScanning() {
        if (abortController) {
            abortController.abort();
            abortController = null;
        }
        isScanning = false;
        scanBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        readModeSelect.disabled = false;
    }

    scanBtn.addEventListener('click', async () => {
        if (isScanning) return;

        resultDiv.innerHTML = "正在初始化，请将 NFC 卡片贴近手机...";
        
        try {
            abortController = new AbortController();
            const ndef = new NDEFReader();
            
            await ndef.scan({ signal: abortController.signal });
            isScanning = true;
            scanBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            readModeSelect.disabled = true;
            
            resultDiv.innerHTML = "已就绪，请刷卡...";

            ndef.addEventListener("reading", ({ serialNumber }) => {
                const rawUid = serialNumber || '未提供UID';
                const uid = rawUid.toUpperCase(); // 转换为全大写
                const now = new Date().toLocaleTimeString();
                const nowTimestamp = Date.now();
                const mode = readModeSelect.value;

                // 防抖检查：防止短时间内同张卡触发多次
                if (uid === lastUid && (nowTimestamp - lastReadTime < DEBOUNCE_TIME)) {
                    return; 
                }
                lastUid = uid;
                lastReadTime = nowTimestamp;

                // 检查卡片是否已经读取过（存在于历史中）
                const existingIndex = historyData.findIndex(item => item.uid === uid);
                
                if (existingIndex !== -1) {
                    resultDiv.innerHTML = `<span class="warning">该卡片已读取过！</span><br><strong>UID:</strong> <code>${uid}</code>`;
                } else {
                    // 正常读取并写入历史记录[cite: 1]
                    let html = `<span class="success">读取成功！</span><br>`;
                    html += `<strong>芯片 ID (UID):</strong> <code>${uid}</code>`;
                    resultDiv.innerHTML = html;

                    historyData.unshift({ time: now, uid: uid });
                    if (historyData.length > 50) historyData.pop(); // 最多保存最近 50 条[cite: 1]
                    localStorage.setItem('nfc_history', JSON.stringify(historyData));
                    renderHistory();
                }

                // 如果是单次读卡模式，处理完毕后自动停止扫描
                if (mode === 'single') {
                    stopScanning();
                    resultDiv.innerHTML += `<br><small style="color:#666;">单次读卡已完成，已自动停止。</small>`;
                }
            });

            ndef.addEventListener("readingerror", () => {
                // 读卡异常时触发手机连续震动 3 次 (震动200ms，暂停100ms，重复3次)
                if ("vibrate" in navigator) {
                    navigator.vibrate([200, 100, 200, 100, 200]);
                }
                resultDiv.innerHTML = '<span class="error">无法读取该卡片，可能非标准 NDEF 格式或移开太快。</span>';
            });

        } catch (error) {
            isScanning = false;
            scanBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            readModeSelect.disabled = false;
            resultDiv.innerHTML = `<span class="error">启动失败: ${error.message}</span>`;
        }
    });

    stopBtn.addEventListener('click', () => {
        stopScanning();
        resultDiv.innerHTML = "已手动停止扫描。";
    });
</script>

</body>
</html>
